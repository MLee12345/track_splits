<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TrackSplits">
  <meta name="theme-color" content="#000000">
  <title>TrackSplits</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --card: #1c1c1c;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #fff;
      --muted: rgba(235, 235, 245, 0.62);
      --green: #70c78a;
      --red: #db6161;
      --cyan: #59c4db;
      --row-stride: 82px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100svh;
      user-select: none;
      touch-action: pan-y;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100svh;
      background: #000;
      margin: 0 auto;
      max-width: 430px;
      padding-bottom: calc(104px + env(safe-area-inset-bottom));
      position: relative;
      width: 100%;
    }

    .header {
      align-items: center;
      background: #000;
      display: flex;
      gap: 12px;
      padding: calc(14px + env(safe-area-inset-top)) 18px 10px;
      position: sticky;
      top: 0;
      z-index: 4;
    }

    .logo {
      align-items: center;
      background: transparent;
      display: grid;
      flex: 0 0 auto;
      height: 48px;
      justify-items: center;
      position: relative;
      width: 48px;
    }

    .logo::before {
      background: rgba(238, 244, 244, 0.92);
      border-radius: 6px 6px 4px 4px;
      box-shadow: 0 -5px 0 -1px rgba(183, 195, 195, 0.88);
      content: "";
      height: 9px;
      left: 50%;
      position: absolute;
      top: 4px;
      transform: translateX(-50%);
      width: 18px;
      z-index: 0;
    }

    .logo::after {
      background: rgba(238, 244, 244, 0.85);
      border-radius: 999px;
      content: "";
      height: 14px;
      position: absolute;
      right: 5px;
      top: 13px;
      transform: rotate(42deg);
      width: 8px;
      z-index: 1;
    }

    .logo-face {
      background: linear-gradient(135deg, var(--green), var(--cyan));
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      box-shadow: inset 3px 2px 0 rgba(255, 255, 255, 0.14), inset -3px -3px 0 rgba(0, 0, 0, 0.08), 0 5px 10px rgba(112, 199, 138, 0.26);
      height: 40px;
      position: relative;
      width: 40px;
      z-index: 2;
    }

    .logo-face::before {
      content: none;
    }

    .logo-hand {
      background: rgba(0, 0, 0, 0.82);
      border-radius: 999px 999px 2px 2px;
      bottom: 50%;
      position: absolute;
      transform: rotate(var(--angle, 0deg));
      transform-origin: 50% 100%;
    }

    .logo-hour {
      height: 9px;
      left: calc(50% - 1.75px);
      width: 3.5px;
    }

    .logo-minute {
      height: 12px;
      left: calc(50% - 1.25px);
      width: 2.5px;
    }

    .logo-face::after {
      content: none;
    }

    .brand {
      min-width: 0;
    }

    .brand-title {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .brand-count {
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      margin-top: 3px;
    }

    .runner-list {
      display: grid;
      gap: 12px;
      padding: 8px 10px 0;
      position: relative;
    }

    .runner-item {
      position: relative;
      transition: transform 180ms cubic-bezier(0.22, 0.8, 0.28, 1);
      z-index: 1;
    }

    .runner-item.dragging {
      pointer-events: none;
      transition: none;
      z-index: 10;
    }

    .runner-item.dragging .runner-card {
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.28);
    }

    .runner-card {
      align-items: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      display: flex;
      gap: 3px;
      min-height: 72px;
      padding: 10px 6px;
      position: relative;
      transition: box-shadow 180ms ease;
      width: 100%;
    }

    .runner-item.open .runner-card {
      border-bottom-color: transparent;
      border-radius: 8px 8px 0 0;
    }

    .move-handle {
      align-items: center;
      align-self: stretch;
      background: transparent;
      display: flex;
      flex: 0 0 14px;
      justify-content: center;
      padding: 0;
      touch-action: none;
    }

    .move-dots {
      display: grid;
      gap: 3px;
      pointer-events: none;
    }

    .move-dots span {
      background: rgba(150, 150, 155, 0.95);
      border-radius: 999px;
      display: block;
      height: 3.5px;
      width: 3.5px;
    }

    .runner-name {
      background: transparent;
      border: 0;
      caret-color: var(--green);
      color: #fff;
      flex: 1 1 auto;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.22;
      min-height: 50px;
      min-width: 34px;
      overflow-wrap: anywhere;
      outline: 0;
      padding: 14px 2px 10px 8px;
      resize: none;
      text-align: left;
      white-space: pre-wrap;
      width: 0;
    }

    .time {
      color: #fff;
      flex: 0 0 104px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1;
      text-align: left;
      white-space: nowrap;
    }

    .control {
      align-items: center;
      border-radius: 8px;
      color: #fff;
      display: inline-flex;
      flex: 0 0 auto;
      font-size: 14px;
      font-weight: 700;
      height: 50px;
      justify-content: center;
    }

    .start-stop {
      background: var(--green);
      width: 46px;
    }

    .start-stop.running {
      background: var(--red);
    }

    .reset {
      background: rgba(255, 255, 255, 0.14);
      width: 46px;
    }

    .reset svg {
      display: block;
      height: 22px;
      width: 22px;
    }

    .delete {
      background: transparent;
      color: rgba(255, 255, 255, 0.86);
      font-size: 24px;
      font-weight: 700;
      width: 28px;
    }

    .add-runner {
      align-items: center;
      background: var(--green);
      border-radius: 999px;
      bottom: calc(24px + env(safe-area-inset-bottom));
      box-shadow: 0 7px 12px rgba(0, 0, 0, 0.45);
      color: #fff;
      display: flex;
      font-size: 36px;
      font-weight: 700;
      height: 62px;
      justify-content: center;
      line-height: 1;
      position: fixed;
      right: max(20px, calc((100vw - 430px) / 2 + 20px));
      width: 62px;
      z-index: 6;
    }

    .runner-details {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-top: 0;
      border-color: transparent;
      border-width: 0;
      border-radius: 0 0 8px 8px;
      display: grid;
      grid-template-rows: 0fr;
      margin: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-4px);
      transform-origin: top;
      transition: grid-template-rows 240ms cubic-bezier(0.22, 0.8, 0.28, 1), opacity 180ms ease, transform 240ms cubic-bezier(0.22, 0.8, 0.28, 1), border-color 180ms ease, border-width 180ms ease;
    }

    .runner-details.open {
      border-color: var(--card-border);
      border-top-color: transparent;
      border-width: 0 1px 1px;
      grid-template-rows: 1fr;
      opacity: 1;
      transform: translateY(0);
    }

    .detail-section {
      min-height: 0;
      overflow: hidden;
      padding: 0 12px;
      transition: padding 240ms cubic-bezier(0.22, 0.8, 0.28, 1);
    }

    .runner-details.open .detail-section {
      padding: 12px;
    }

    .detail-section + .detail-section {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .field-group {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      overflow: hidden;
    }

    .notes-editor {
      background: transparent;
      border: 0;
      caret-color: var(--green);
      color: #fff;
      display: block;
      outline: 0;
      padding: 11px 12px;
      resize: none;
      width: 100%;
    }

    .notes-editor {
      line-height: 1.35;
      min-height: 42px;
      overflow: hidden;
    }

    @media (max-width: 390px) {
      .brand-title {
        font-size: 26px;
      }

      .runner-list {
        padding-left: 8px;
        padding-right: 8px;
      }

      .runner-card {
        gap: 2px;
        padding-left: 5px;
        padding-right: 5px;
      }

      .time {
        flex-basis: 100px;
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="TrackSplits">
    <header class="header">
      <div class="logo" aria-hidden="true">
        <div class="logo-face">
          <span class="logo-hand logo-hour" id="logo-hour"></span>
          <span class="logo-hand logo-minute" id="logo-minute"></span>
        </div>
      </div>
      <div class="brand">
        <div class="brand-title">TrackSplits</div>
        <div class="brand-count" id="runner-count">4 runners</div>
      </div>
    </header>

    <section class="runner-list" id="runner-list" aria-label="Runners"></section>

    <button class="add-runner" id="add-runner" type="button" aria-label="Add runner">+</button>
  </main>

  <script>
    const rowStride = 82;
    const list = document.getElementById("runner-list");
    const runnerCount = document.getElementById("runner-count");
    const addButton = document.getElementById("add-runner");
    const logoHour = document.getElementById("logo-hour");
    const logoMinute = document.getElementById("logo-minute");
    const storageKey = "tracksplits.web.state.v1";

    let runners = loadStoredRunners();
    let selectedRunnerId = null;
    let drag = null;
    let lastTick = 0;

    function makeRunner(name) {
      return {
        id: globalThis.crypto?.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
        name,
        elapsedBeforeStart: 0,
        startedAt: null,
        workout: { notes: "" }
      };
    }

    function defaultRunners() {
      return Array.from({ length: 4 }, (_, index) => makeRunner(`Runner ${index + 1}`));
    }

    function loadStoredRunners() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
        if (!saved || !Array.isArray(saved.runners) || saved.runners.length === 0) {
          return defaultRunners();
        }

        const nowEpoch = Date.now();
        const nowPerformance = performance.now();

        return saved.runners.map((runner, index) => {
          const startedAtEpoch = Number.isFinite(runner.startedAtEpoch) ? runner.startedAtEpoch : null;
          const elapsedSinceStart = startedAtEpoch === null ? 0 : Math.max(0, (nowEpoch - startedAtEpoch) / 1000);

          return {
            id: typeof runner.id === "string" ? runner.id : makeRunner("").id,
            name: typeof runner.name === "string" && runner.name.trim() ? runner.name : `Runner ${index + 1}`,
            elapsedBeforeStart: Number.isFinite(runner.elapsedBeforeStart) ? runner.elapsedBeforeStart : 0,
            startedAt: startedAtEpoch === null ? null : nowPerformance - elapsedSinceStart * 1000,
            workout: {
              notes: typeof runner.workout?.notes === "string" ? runner.workout.notes : ""
            }
          };
        });
      } catch {
        return defaultRunners();
      }
    }

    function saveState() {
      const nowEpoch = Date.now();
      const nowPerformance = performance.now();
      const saved = {
        runners: runners.map((runner) => ({
          id: runner.id,
          name: runner.name,
          elapsedBeforeStart: runner.elapsedBeforeStart,
          startedAtEpoch: runner.startedAt === null ? null : nowEpoch - Math.max(0, nowPerformance - runner.startedAt),
          workout: {
            notes: runner.workout.notes
          }
        }))
      };

      try {
        localStorage.setItem(storageKey, JSON.stringify(saved));
      } catch {
        // Same-device persistence is best-effort; the app should still work if storage is blocked.
      }
    }

    function elapsed(runner, now = performance.now()) {
      if (runner.startedAt === null) {
        return runner.elapsedBeforeStart;
      }

      return runner.elapsedBeforeStart + ((now - runner.startedAt) / 1000);
    }

    function formattedElapsed(runner, now = performance.now()) {
      const total = Math.max(0, elapsed(runner, now));
      const minutes = Math.floor(total / 60);
      const seconds = Math.floor(total) % 60;
      const hundredths = Math.floor(total * 100) % 100;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${String(hundredths).padStart(2, "0")}`;
    }

    function nextDefaultRunnerName() {
      let runnerNumber = 1;
      while (runners.some((runner) => runner.name === `Runner ${runnerNumber}`)) {
        runnerNumber += 1;
      }

      return `Runner ${runnerNumber}`;
    }

    function commitRunnerNames() {
      runners = runners.map((runner, index) => {
        const trimmed = runner.name.trim();
        return { ...runner, name: trimmed || `Runner ${index + 1}` };
      });
      saveState();
    }

    function render() {
      runnerCount.textContent = `${runners.length} ${runners.length === 1 ? "runner" : "runners"}`;
      list.innerHTML = "";

      runners.forEach((runner) => {
        const item = document.createElement("div");
        item.className = `runner-item${selectedRunnerId === runner.id ? " open" : ""}`;
        item.dataset.runnerId = runner.id;

        const card = document.createElement("article");
        card.className = "runner-card";
        card.dataset.runnerId = runner.id;
        card.setAttribute("aria-label", runner.name);

        const handle = document.createElement("button");
        handle.className = "move-handle";
        handle.type = "button";
        handle.setAttribute("aria-label", `Move ${runner.name}`);
        handle.innerHTML = "<span class=\"move-dots\"><span></span><span></span><span></span></span>";
        handle.addEventListener("pointerdown", (event) => beginDrag(event, runner.id));

        const name = document.createElement("textarea");
        name.className = "runner-name autosize";
        name.value = runner.name;
        name.rows = 1;
        name.autocapitalize = "none";
        name.autocomplete = "off";
        name.spellcheck = false;
        name.addEventListener("click", (event) => {
          event.stopPropagation();
        });
        name.addEventListener("input", () => {
          runner.name = name.value;
          card.setAttribute("aria-label", runner.name);
          autoSize(name);
          saveState();
        });
        name.addEventListener("blur", () => {
          commitRunnerNames();
          render();
        });

        const time = document.createElement("div");
        time.className = "time";
        time.dataset.timeFor = runner.id;
        time.textContent = formattedElapsed(runner);

        const start = document.createElement("button");
        start.className = `control start-stop${runner.startedAt !== null ? " running" : ""}`;
        start.type = "button";
        start.textContent = runner.startedAt !== null ? "Stop" : "Start";
        start.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleRunner(runner.id);
        });

        const reset = document.createElement("button");
        reset.className = "control reset";
        reset.type = "button";
        reset.setAttribute("aria-label", `Reset ${runner.name}`);
        reset.innerHTML = `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 7H4V3" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M4.6 7.2A8 8 0 1 1 4 12" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"></path>
          </svg>
        `;
        reset.addEventListener("click", (event) => {
          event.stopPropagation();
          resetRunner(runner.id);
        });

        const del = document.createElement("button");
        del.className = "delete";
        del.type = "button";
        del.setAttribute("aria-label", `Delete ${runner.name}`);
        del.textContent = "×";
        del.addEventListener("click", (event) => {
          event.stopPropagation();
          removeRunner(runner.id);
        });

        card.addEventListener("click", () => openDetails(runner.id));

        card.append(handle, name, time, start, reset, del);
        item.append(card);

        item.append(createDetails(runner));

        list.append(item);
      });

      autoSizeEditors();
    }

    function toggleRunner(id) {
      const runner = runners.find((item) => item.id === id);
      if (!runner) return;

      const now = performance.now();
      if (runner.startedAt !== null) {
        runner.elapsedBeforeStart += (now - runner.startedAt) / 1000;
        runner.startedAt = null;
      } else {
        runner.startedAt = now;
      }

      saveState();
      render();
    }

    function resetRunner(id) {
      const runner = runners.find((item) => item.id === id);
      if (!runner) return;

      runner.elapsedBeforeStart = 0;
      if (runner.startedAt !== null) {
        runner.startedAt = performance.now();
      }

      saveState();
      updateTimes(performance.now());
    }

    function removeRunner(id) {
      commitRunnerNames();
      runners = runners.filter((runner) => runner.id !== id);
      if (selectedRunnerId === id) {
        selectedRunnerId = null;
      }
      saveState();
      render();
    }

    function addRunner() {
      commitRunnerNames();
      runners.push(makeRunner(nextDefaultRunnerName()));
      saveState();
      render();
    }

    function openDetails(id) {
      if (drag) return;

      selectedRunnerId = selectedRunnerId === id ? null : id;
      updateDetailsVisibility();
    }

    function createDetails(runner) {
      const details = document.createElement("section");
      details.className = "runner-details";
      details.dataset.detailsFor = runner.id;
      details.setAttribute("aria-hidden", selectedRunnerId === runner.id ? "false" : "true");
      if (selectedRunnerId === runner.id) {
        details.classList.add("open");
      }

      const notesSection = document.createElement("div");
      notesSection.className = "detail-section";

      const notesFields = document.createElement("div");
      notesFields.className = "field-group";

      const notesEditor = document.createElement("textarea");
      notesEditor.className = "notes-editor autosize";
      notesEditor.value = runner.workout.notes;
      notesEditor.placeholder = "Notes";
      notesEditor.rows = 1;
      notesEditor.autocapitalize = "none";
      notesEditor.autocomplete = "off";
      notesEditor.spellcheck = true;
      notesEditor.addEventListener("click", (event) => event.stopPropagation());
      notesEditor.addEventListener("input", () => {
        runner.workout.notes = notesEditor.value;
        autoSize(notesEditor);
        saveState();
      });

      notesFields.append(notesEditor);
      notesSection.append(notesFields);
      details.append(notesSection);

      return details;
    }

    function updateDetailsVisibility() {
      document.querySelectorAll(".runner-details").forEach((details) => {
        const isOpen = details.dataset.detailsFor === selectedRunnerId;
        details.closest(".runner-item")?.classList.toggle("open", isOpen);
        details.classList.toggle("open", isOpen);
        details.setAttribute("aria-hidden", isOpen ? "false" : "true");
      });
    }

    function autoSizeEditors() {
      document.querySelectorAll(".autosize").forEach(autoSize);
    }

    function autoSize(editor) {
      editor.style.height = "auto";
      editor.style.height = `${editor.scrollHeight}px`;
    }

    function beginDrag(event, id) {
      event.preventDefault();
      event.stopPropagation();
      commitRunnerNames();

      const item = event.currentTarget.closest(".runner-item");
      if (!item) return;

      const startIndex = runners.findIndex((runner) => runner.id === id);
      if (startIndex === -1) return;

      const rect = item.getBoundingClientRect();
      drag = {
        id,
        pointerId: event.pointerId,
        startIndex,
        targetIndex: startIndex,
        startY: event.clientY,
        item,
        height: rect.height
      };

      item.classList.add("dragging");
      item.style.transform = "scale(1.015)";

      event.currentTarget.setPointerCapture(event.pointerId);
      window.addEventListener("pointermove", updateDrag, { passive: false });
      window.addEventListener("pointerup", finishDrag, { once: true });
      window.addEventListener("pointercancel", finishDrag, { once: true });
    }

    function updateDrag(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;

      event.preventDefault();
      const translation = event.clientY - drag.startY;
      const proposed = drag.startIndex + Math.round(translation / rowStride);
      drag.targetIndex = Math.min(Math.max(proposed, 0), runners.length - 1);

      drag.item.style.transform = `translate3d(0, ${translation}px, 0) scale(1.015)`;
      moveCardsAway();
    }

    function moveCardsAway() {
      const items = list.querySelectorAll(".runner-item");
      items.forEach((item) => {
        if (item.dataset.runnerId === drag.id) return;

        const index = runners.findIndex((runner) => runner.id === item.dataset.runnerId);
        let offset = 0;
        if (drag.targetIndex > drag.startIndex && index > drag.startIndex && index <= drag.targetIndex) {
          offset = -rowStride;
        }

        if (drag.targetIndex < drag.startIndex && index >= drag.targetIndex && index < drag.startIndex) {
          offset = rowStride;
        }

        item.style.transform = offset ? `translate3d(0, ${offset}px, 0)` : "";
      });
    }

    function finishDrag(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;

      window.removeEventListener("pointermove", updateDrag);
      const { id, targetIndex } = drag;
      const currentIndex = runners.findIndex((runner) => runner.id === id);

      if (currentIndex !== -1 && currentIndex !== targetIndex) {
        const [runner] = runners.splice(currentIndex, 1);
        runners.splice(targetIndex, 0, runner);
      }

      saveState();
      drag = null;
      render();
    }

    function updateTimes(now) {
      document.querySelectorAll("[data-time-for]").forEach((node) => {
        const runner = runners.find((item) => item.id === node.dataset.timeFor);
        if (runner) {
          node.textContent = formattedElapsed(runner, now);
        }
      });

    }

    function updateClockLogo() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes() + seconds / 60;
      const hours = (now.getHours() % 12) + minutes / 60;

      logoHour.style.setProperty("--angle", `${hours * 30}deg`);
      logoMinute.style.setProperty("--angle", `${minutes * 6}deg`);
    }

    function tick(now) {
      if (now - lastTick > 16) {
        updateTimes(now);
        lastTick = now;
      }

      requestAnimationFrame(tick);
    }

    addButton.addEventListener("click", addRunner);
    window.addEventListener("beforeunload", saveState);

    render();
    updateClockLogo();
    setInterval(updateClockLogo, 1000);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
